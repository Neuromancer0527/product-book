<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Book</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: #525659; font-family: -apple-system, sans-serif; }
        iframe, object { width: 100%; height: 100%; border: none; display: block; }
        
        .container { width: 100%; height: 100%; position: relative; }
        
        /* 兜底下载提示卡片 */
        .fallback {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; color: #fff; padding: 20px; width: 85%; max-width: 400px;
            background: rgba(0,0,0,0.6); border-radius: 12px; backdrop-filter: blur(5px);
        }
        .fallback p { font-size: 15px; margin-bottom: 15px; line-height: 1.5; color: #ddd; }
        .fallback a {
            display: inline-block; width: 100%; padding: 12px 0; background: #07c160;
            color: #fff; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 优先使用原生渲染，iOS Safari / Chrome 手机端均可直接渲染 -->
        <object data="/web/catalog.pdf" type="application/pdf" width="100%" height="100%">
            <iframe src="/web/catalog.pdf" width="100%" height="100%">
                <!-- 如果手机连 iframe 也彻底无法解析 PDF，展示优雅的按钮提示 -->
                <div class="fallback">
                    <p>您的手机浏览器暂不支持直接预览 PDF 档</p>
                    <a href="/web/catalog.pdf" target="_blank">点击此处打开 / 下载 PDF 文件</a>
                </div>
            </iframe>
        </object>
    </div>

</body>
</html>
