<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Product Book</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: #525659; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>

    <!-- 
      核心修改点：在链接末尾加上了 #toolbar=0&navpanes=0&scrollbar=1
      这会强制隐藏 PDF.js 顶部的所有工具栏和侧边栏，只留纯净的 PDF 文件展示
    -->
    <iframe src="https://mozilla.github.io/pdf.js/web/viewer.html?file=https://newlightsoldout.fun/web/catalog.pdf#toolbar=0&navpanes=0&scrollbar=1"></iframe>

</body>
</html>
