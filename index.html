<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Book</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        iframe { width: 100%; height: 100%; border: none; }
        
        /* 微信顶部提示条 */
        .wx-tip {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%;
            background: #fff3cd; color: #856404;
            padding: 10px; text-align: center; font-size: 14px;
            z-index: 999; border-bottom: 1px solid #ffeeba;
        }
    </style>
</head>
<body>
    <div id="wxTip" class="wx-tip">如无法加载，请点击右上角「...」选择<b>在浏览器打开</b></div>

    <!-- 使用 Mozilla 官方 PDF 渲染引擎，保证全平台（包括微信）都可以顺畅预览 -->
    <iframe src="https://mozilla.github.io/pdf.js/web/viewer.html?file=https://newlightsoldout.fun/web/catalog.pdf"></iframe>

    <script>
        // 检测是否在微信内置浏览器中打开，如果是，显示温馨提示
        var ua = navigator.userAgent.toLowerCase();
        if (ua.match(/MicroMessenger/i) == "micromessenger") {
            document.getElementById('wxTip').style.display = 'block';
        }
    </script>
</body>
</html>
